# =============================================================================
# ClusterOps frontend — nginx site configuration
#
# Serves the built SPA and reverse-proxies the backend surface. This mirrors the
# seven prefixes in `vite.config.ts` exactly, so the app behaves identically in
# dev and inside the container.
#
# Why seven, not the two in the phase document
# --------------------------------------------
# The phase document proxies only `/api/` and `/health`. The application also
# needs `/metrics` (the latency panel reads the Prometheus exposition),
# `/mlflow` (accuracy and governance read the champion run's metrics),
# `/grafana` (the infrastructure matrix probes it), and `/docs` plus
# `/openapi.json` (the developer links and the API reference). Omitting any of
# them turns a working admin console into a row of 404s behind the proxy.
#
# Note the Grafana target is port **3000**, not 3001: compose publishes
# `3001:3000`, so 3001 is the host port and 3000 is the container's.
# =============================================================================

upstream clusterops_backend {
    server backend:8000;
    keepalive 16;
}

upstream clusterops_mlflow {
    server mlflow:5000;
}

upstream clusterops_grafana {
    server grafana:3000;
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Conservative defaults; the app never embeds third-party frames.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The build emits roughly 0.6 MB of JS. Text formats only — images are
    # already compressed and would gain nothing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Static assets
    #
    # Cached by path prefix rather than by a `location ~* \.(js|css)$` regex.
    # A regex location outranks every prefix location in nginx, so the phase
    # document's pattern would also capture `/mlflow/…/model.js` and try to
    # serve it off disk instead of proxying it. Vite writes every hashed bundle
    # under /assets/, which is exact and cannot collide with a proxied prefix.
    #
    # The security headers are repeated in each block that sets one. nginx does
    # not merge `add_header` across levels — a block with its own `add_header`
    # discards every inherited one — so declaring them only at `server` scope
    # would silently drop them from exactly the asset responses that need them.
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the current hashed
    # bundles, so a cached copy pins browsers to a previous deployment.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # -------------------------------------------------------------------------
    # Backend surface
    #
    # `proxy_pass` with no URI part forwards the original request URI unchanged.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://clusterops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://clusterops_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Prometheus text exposition, read by the infrastructure latency panel.
    location = /metrics {
        proxy_pass http://clusterops_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
    }

    location /docs {
        proxy_pass http://clusterops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location = /openapi.json {
        proxy_pass http://clusterops_backend/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # -------------------------------------------------------------------------
    # Supporting services
    #
    # The trailing slash on `proxy_pass` strips the matched prefix, so
    # `/mlflow/health` reaches MLflow at `/health` and `/mlflow/api/2.0/...`
    # reaches `/api/2.0/...`. This mirrors `stripPrefix` in vite.config.ts.
    # -------------------------------------------------------------------------
    location = /mlflow {
        return 302 /mlflow/;
    }

    location /mlflow/ {
        proxy_pass http://clusterops_mlflow/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location = /grafana {
        return 302 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://clusterops_grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # SPA client-side routing
    #
    # `/inventory`, `/orders/new`, `/approvals` and `/admin` have no file on
    # disk. Without this fallback nginx answers 404 on a deep link or a refresh.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
