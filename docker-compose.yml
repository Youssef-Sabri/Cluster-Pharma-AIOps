# ClusterOps — Phase 1 infrastructure, extended in Phase 5 with the API and the
# observability stack, and in Phase 6 with the containerised frontend.
#   PostgreSQL 15 (application + MLflow backend store), the MLflow tracking
#   server, the FastAPI backend, Prometheus, Grafana, and the nginx-served SPA.
#
# NOTE: All data produced by this stack is 100% synthetic, generated by
# `python -m app.pipelines.data_generator`. It is for demonstration purposes only.
#
# Usage:
#   docker compose up -d postgres mlflow
#   docker compose up -d                      # everything, including the API and the UI
#   docker compose ps
#   docker compose logs -f backend
#   curl http://localhost:3000                 # ClusterOps frontend
#   curl http://localhost:8000/docs            # Swagger UI

name: clusterops

services:
  postgres:
    image: postgres:15
    container_name: clusterops-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cluster
      POSTGRES_PASSWORD: cluster
      POSTGRES_DB: clusterops
      # Deterministic collation so ORDER BY / index behaviour is stable across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # First-boot only: creates the dedicated `mlflow` backend-store database
      # and the disposable `clusterops_test` database used by the test-suite.
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cluster -d clusterops -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - clusterops

  mlflow:
    build:
      context: .
      dockerfile: ops/mlflow/Dockerfile
    image: clusterops/mlflow:2.14.0
    container_name: clusterops-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://cluster:cluster@postgres:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - clusterops

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clusterops/backend:1.0.0
    container_name: clusterops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cluster:cluster@postgres:5432/clusterops
      SYNC_DATABASE_URL: postgresql://cluster:cluster@postgres:5432/clusterops
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREFECT_API_URL: http://localhost:4200/api
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Empty by default: Stage 2 of the order matcher self-disables without a key,
      # so the API runs fully offline with rapidfuzz matching only.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/mlflow/artifacts:ro
    healthcheck:
      # Required by the frontend service, which gates on `service_healthy`.
      # Without it that dependency never resolves and the frontend waits
      # forever for a condition nothing can satisfy.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - clusterops

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: clusterops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    depends_on:
      - backend
    networks:
      - clusterops

  grafana:
    image: grafana/grafana:10.4.0
    container_name: clusterops-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-cluster}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - clusterops

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: clusterops/frontend:1.0.0
    container_name: clusterops-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    # The SPA needs the backend to answer before it is useful, but not to boot:
    # the shell renders and each panel reports its own load failure. Waiting for
    # a healthy backend would mean a frontend that never starts when the API is
    # deliberately down, which is the case the error states exist to cover.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - clusterops

volumes:
  postgres_data:
  mlflow_artifacts:

networks:
  clusterops:
    driver: bridge