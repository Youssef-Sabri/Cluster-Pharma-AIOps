# Alembic configuration — ClusterOps backend.
#
# The database URL is intentionally NOT stored here: `alembic/env.py` injects
# `settings.database_url` (asyncpg) so there is exactly one source of truth for
# connection details, in `backend/app/config.py` / `.env`.
#
# Usage (from `backend/`):
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe change"
#   alembic downgrade -1
#   alembic history -v

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# Timestamped, sortable revision filenames: 0001_initial_schema_20261017_1200.py
file_template = %%(rev)s_%%(slug)s_%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d
# sqlite:// is a placeholder only; env.py overrides it at runtime.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S